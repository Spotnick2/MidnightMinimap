# From the template References\Docs\release\package-check.yml (RELEASING.md §2),
# with three differences, all because MidnightMinimap ships one TOC for two
# clients (## Interface: 16001, 20505) and has no Wago project:
#   - the packager names a two-client zip without a flavor suffix, so the zip
#     is $ADDON-<tag>.zip, not $ADDON-<tag>-forever.zip;
#   - tests/release_files.sh also maps 20xxx to the packager's "bcc" flavor;
#   - no `wago` job and no `publish` input: GitHub is the only target here.
#     Add the template's `wago` job (and X-Wago-ID, WAGO_API_TOKEN) once a Wago
#     project exists.
name: Package check

# `check` is a dry run. -d is the real no-upload switch: merely leaving
# CF_API_KEY out still lets the packager cut a GitHub release - with the WHOLE
# CHANGELOG.md as its notes. CurseForge keeps building releases with its own
# packager from the tag webhook.
#
# On a tag, once `check` has passed, the zip it built and checked is published
# as is, never rebuilt: `release` makes the GitHub Release (with release.json).
# The packager stays out of it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish an existing tag again where it failed. Run it from main: `check`
  # builds the tag's tree, notes included.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.2.0)
        required: true

permissions:
  contents: read

env:
  ADDON: MidnightMinimap

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Empty except on a manual run, so checkout keeps its default: the
          # commit that triggered the run (a branch ref would build its tip).
          ref: ${{ inputs.tag }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Syntax check
        run: luac5.1 -p *.lua tests/*.lua

      - name: Forever startup smoke test
        run: lua5.1 tests/test_forever.lua

      # On a manual run GITHUB_REF is main, and the packager names the build
      # after whichever tag at HEAD it sorts first (release.sh 613-628 prefers
      # GITHUB_REF_NAME only on a tag push). An alpha promoted to a release
      # without a code change puts two tags on one commit, so drop the others
      # from this checkout: the zip and its TOC version are the requested tag's.
      - name: Only the requested tag at HEAD
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for t in $(git tag --points-at HEAD); do
            [ "$t" = "$TAG" ] || git tag -d "$t"
          done
          test "$(git tag --points-at HEAD)" = "$TAG" || { echo "$TAG is not at HEAD"; exit 1; }

      # Pinned to a SHA, not the moving v2 tag.
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # No probe ships (PROBES.md): a probe is a Tools/<X>Probe ForeverProbe
      # module that .pkgmeta keeps out, never code the addon's TOC loads.
      # GuildSpy and Gnomesweeper once shipped probe commands. A file or
      # folder named *probe* (any case), or a TOC that depends on
      # ForeverProbe, fails the run. Name a shipped file otherwise. Python's
      # zipfile opens each entry by its exact name: a path with spaces or
      # brackets is read, not split or pattern-matched, and a read error
      # fails the step instead of passing it (Codex, #62).
      - name: No probe in the zip
        run: |
          zip=$(ls .release/*.zip | head -1)
          python3 - "$zip" <<'PY'
          import re, sys, zipfile
          path, found = sys.argv[1], []
          dep = re.compile(r"\s*##\s*[A-Za-z-]*Dep[A-Za-z-]*:.*ForeverProbe", re.I)
          with zipfile.ZipFile(path) as z:
              for name in z.namelist():
                  if any("probe" in part.lower() for part in name.rstrip("/").split("/")):
                      found.append(name)
                  if name.lower().endswith(".toc"):
                      for line in z.read(name).decode("utf-8", "replace").splitlines():
                          if dep.match(line):
                              found.append(f"{name}: {line.strip()}")
          if found:
              print(f"{path} ships a probe. Probes never ship (References/Docs/PROBES.md):")
              print("\n".join(found))
              sys.exit(1)
          print(f"no probe in {path}")
          PY

      # Exactly one zip, one top-level folder, and in it only the TOC, the
      # files the TOC lists, LICENSE and the repo's Textures/*.blp, all of
      # them present. The TOC's version must be substituted.
      - name: The zip holds exactly the addon
        run: |
          test "$(ls .release/*.zip | wc -l)" = 1 || { ls .release; echo "expected one zip"; exit 1; }
          zip=$(ls .release/*.zip)
          git ls-files 'Textures/*.blp' > "$RUNNER_TEMP/textures.txt"
          python3 - "$zip" "$ADDON" "$RUNNER_TEMP/textures.txt" <<'PY'
          import re, sys, zipfile
          path, addon, textures = sys.argv[1:]
          with zipfile.ZipFile(path) as z:
              names = {n for n in z.namelist() if not n.endswith("/")}
              toc_name = f"{addon}/{addon}.toc"
              if toc_name not in names:
                  sys.exit(f"{path} has no {toc_name}")
              toc = z.read(toc_name).decode("utf-8").replace("\r", "")
          listed = [l.strip().replace("\\", "/") for l in toc.splitlines()
                    if l.strip() and not l.lstrip().startswith("#")]
          want = {toc_name, f"{addon}/LICENSE"} | {f"{addon}/{f}" for f in listed}
          want |= {f"{addon}/{t.strip()}" for t in open(textures) if t.strip()}
          extra, missing = sorted(names - want), sorted(want - names)
          version = re.search(r"^## Version: *(.*)$", toc, re.M)
          errors = []
          if extra:
              errors.append("not allowed: " + ", ".join(extra))
          if missing:
              errors.append("missing: " + ", ".join(missing))
          if not version or not version.group(1).strip() or "@" in version.group(1):
              errors.append(f"the version is not substituted: {version.group(0) if version else 'no ## Version'}")
          if errors:
              sys.exit(f"{path}:\n" + "\n".join(errors))
          print(f"{path}: {len(names)} files, {version.group(0)}")
          PY

      # What a tag publishes next to the zip, from the tag's own CHANGELOG.md,
      # built on every run so a changelog heading or TOC field that breaks it
      # fails on the pull request. Off a tag there is no tag section, so it
      # reads the newest one. `release` publishes these very files.
      # The script is the workflow's own (GITHUB_SHA), not the checked-out
      # tree's: a manual run checks out the requested tag, and a tag from
      # before the script has none (Codex, NodeRadar #36).
      - name: The release notes and release.json build
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          zip=$(ls .release/*.zip | head -1)
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(tr -d '\r' < CHANGELOG.md | sed -n 's/^## \(v[^ ]*\).*/\1/p' | head -1)
          fi
          git show "$GITHUB_SHA:tests/release_files.sh" > "$RUNNER_TEMP/release_files.sh"
          bash "$RUNNER_TEMP/release_files.sh" "$tag" "$zip" "$RUNNER_TEMP/release-files"

      # .release is a hidden directory, and upload-artifact@v4 skips hidden
      # content by default - without include-hidden-files the upload finds
      # nothing. `warn` then leaves the job green while publishing no artifact.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep the notes and release.json for the publishers
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

  # A GitHub Release for every tag: the zip `check` built and checked,
  # release.json, and the tag's CHANGELOG.md section as the notes. The only job
  # allowed to write to the repository.
  # One publisher per tag at a time: the tag's push and a manual retry, or two
  # retries, share the group (the same key as TAG below). Two at once could
  # both see a draft, and the second's --clobber would then delete a
  # release.json the first had just published (Codex, #57). The one running
  # always finishes. GitHub keeps one waiting job per group: it starts after
  # the running one and finds the release done, and a newer run for the tag
  # cancels it and waits in its place.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Everything comes from `check`'s artifacts - the zip, and the notes and
      # release.json it built from the tag's tree - so there is no checkout:
      # on a manual run from main, one would read main's CHANGELOG.md.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The zip and release.json are the tag's
        run: |
          ls dist out
          zip="dist/$ADDON-$TAG.zip"
          test -f "$zip" || { echo "no $zip"; exit 1; }
          jq -e --arg v "$TAG" --arg f "${zip#dist/}" \
            '.releases[0].version == $v and .releases[0].filename == $f' out/release.json > /dev/null ||
            { echo "release.json is not $TAG's:"; cat out/release.json; exit 1; }
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # The title is release.json's name: the packaged TOC's Title, colour
      # codes stripped. GitHub renames an asset with characters it doesn't
      # allow (!Bugsy-v0.1.0-forever.zip was stored as Bugsy-v0.1.0-forever.zip),
      # and WowUp picks the asset by release.json's filename: so the zip goes
      # up first, and release.json names it as GitHub stored it (Bugsy #38).
      # Creating a release and uploading each asset are separate requests, so
      # any of them can fail after the others succeeded. The release stays a
      # draft until both assets are there, and a run again (workflow_dispatch)
      # completes whatever an earlier run left: it reuses the release, keeps a
      # zip already uploaded if it is this run's package (else replaces a
      # draft's and stops on a published one), uploads release.json if it's missing, then
      # publishes. A published release.json is never taken away: gh's
      # --clobber deletes the old asset before uploading the new one, so a
      # retry (a manual run) that failed there would leave a
      # live release without the file WowUp reads (Codex, GlassUI #211). One
      # that matches is kept; one that differs stops the run for a repair by
      # hand. Only a draft's is replaced.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=false
          case "${TAG,,}" in *alpha*|*beta*) pre=true ;; esac
          title="$(jq -r '.releases[0].name' out/release.json) ${TAG#v}"
          repo=(--repo "$GITHUB_REPOSITORY")
          mkdir -p gh
          stored_zip() {
            gh release view "$TAG" "${repo[@]}" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | .name' | grep -- '\.zip$' || true
          }
          # The same package: the same files with the same CRC-32 and size.
          # Entry timestamps differ between builds of one commit, so the zips'
          # own bytes are not compared.
          same_zip() {
            python3 - "$1" "$2" <<'PY'
          import sys, zipfile
          def entries(path):
              with zipfile.ZipFile(path) as z:
                  return sorted((i.filename, i.CRC, i.file_size) for i in z.infolist() if not i.is_dir())
          sys.exit(0 if entries(sys.argv[1]) == entries(sys.argv[2]) else 1)
          PY
          }
          if gh release view "$TAG" "${repo[@]}" > /dev/null 2>&1; then
            echo "$TAG already has a release: completing it"
            # An upload that failed can leave an empty asset in "starter"
            # state. It still holds its name, and gh refuses to upload over a
            # name that exists, so a retry deletes every unfinished asset
            # first, the zip's or release.json's. Finished assets are kept.
            gh release view "$TAG" "${repo[@]}" --json assets \
              --jq '.assets[] | select(.state != "uploaded") | .apiUrl' |
              while read -r url; do
                echo "deleting an unfinished asset: $url"
                gh api -X DELETE "${url#https://api.github.com/}"
              done
            # A zip already there is kept only if it is the package `check`
            # built and checked: an earlier run's, or one uploaded by hand
            # that matches. Another one is replaced on a draft, and stops the
            # run on a published release, before its title and notes change
            # (Codex, #3). v1.1.0's release has a zip uploaded by hand.
            stored=$(stored_zip)
            if [ "$(printf '%s' "$stored" | grep -c .)" -gt 1 ]; then
              echo "$TAG has more than one zip: $stored"
              echo "Repair by hand: keep one, or delete the release and run again."
              exit 1
            fi
            if [ -n "$stored" ]; then
              gh release download "$TAG" "${repo[@]}" -p "$stored" -O gh/stored.zip --clobber
              if same_zip gh/stored.zip "$ZIP"; then
                echo "keeping $stored: it is the package check built"
              elif [ "$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft)" = true ]; then
                echo "replacing the draft's $stored: not the package check built"
                gh release delete-asset "$TAG" "$stored" "${repo[@]}" --yes
              else
                echo "$TAG is published with $stored, which is not the package check built."
                echo "Not replaced. Repair by hand (delete the asset and run again), or delete the release and run again."
                exit 1
              fi
            fi
            gh release edit "$TAG" "${repo[@]}" --title "$title" --notes-file out/notes.md --prerelease="$pre"
          else
            gh release create "$TAG" "${repo[@]}" --verify-tag --draft \
              --title "$title" --notes-file out/notes.md --prerelease="$pre"
          fi
          asset=$(stored_zip)
          if [ -z "$asset" ]; then
            gh release upload "$TAG" "$ZIP" "${repo[@]}"
            asset=$(stored_zip)
          fi
          test -n "$asset" || { echo "the release has no .zip asset"; exit 1; }
          echo "the zip is stored as $asset"
          jq -c --arg f "$asset" '.releases[0].filename = $f' out/release.json > gh/release.json
          cat gh/release.json
          if gh release view "$TAG" "${repo[@]}" --json assets \
               --jq '.assets[] | select(.state == "uploaded") | .name' | grep -qx 'release\.json'; then
            gh release download "$TAG" "${repo[@]}" -p release.json -O gh/stored.json --clobber
            if jq -e --slurpfile want gh/release.json '. == $want[0]' gh/stored.json > /dev/null; then
              echo "keeping the release.json an earlier run uploaded: it is this one"
            elif [ "$(gh release view "$TAG" "${repo[@]}" --json isDraft --jq .isDraft)" = true ]; then
              echo "replacing the draft's release.json"
              gh release upload "$TAG" gh/release.json "${repo[@]}" --clobber
            else
              echo "$TAG is published with another release.json:"
              cat gh/stored.json
              echo "Not replaced: a failed upload would leave the release without one."
              echo "Repair by hand (delete the asset, upload gh/release.json), or delete the release and run again."
              exit 1
            fi
          else
            gh release upload "$TAG" gh/release.json "${repo[@]}"
          fi
          gh release edit "$TAG" "${repo[@]}" --draft=false
